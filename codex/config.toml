model = "gpt-6-luna"
model_reasoning_effort = "medium"
service_tier = "default"

approval_policy = "never"
sandbox_mode   = "workspace-write"

[sandbox_workspace_write]
network_access = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "context-remaining", "five-hour-limit", "weekly-limit", "run-state"]
status_line_use_colors = true
keymap.global.open_external_editor = "ctrl-e"
keymap.editor.move_line_end = "ctrl-g"
screen_reader_detection_done = true
session_picker_view = "comfortable"

[tui.model_availability_nux]
"gpt-5.6-sol" = 4
gpt-6-astra = 4
"gpt-6.1-sol" = 4

[analytics]
enabled = false

[marketplaces.openai-bundled]
