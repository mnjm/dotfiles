onboarding = false

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#000000"
active_row_bg = "#1f5f3a"
selection_bg = "#ff9470"
panel_bg = "#000000"
accent = "#1f5f3a"
red = "#d70000"
green = "#a6e3a1"

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
new_tab = "prefix+t"
close_pane = "prefix+w"
split_horizontal = "prefix+backslash"
split_vertical = "prefix+minus"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
resize_pane_left = "prefix+h"
resize_pane_down = "prefix+j"
resize_pane_up = "prefix+k"
resize_pane_right = "prefix+l"
workspace_picker = "prefix+s"
goto = "prefix+shift+s"
previous_workspace = "prefix+p"
rename_workspace = "prefix+shift+r"
move_tab_previous = "prefix+shift+comma"
move_tab_next = "prefix+shift+period"
previous_tab = "alt+left"
next_tab = "alt+right"
switch_tab = "prefix+1..9"
zoom = "prefix+z"
reload_config = "prefix+shift+c"
detach = "prefix+d"

[ui]
show_agent_labels_on_pane_borders = true
pane_borders = true
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false
mouse_capture = true
copy_on_select = true
confirm_close = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false
tab_bar_position = "top"
